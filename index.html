<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>360watts - Smart Solar & Home Automation Solutions | Coimbatore</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="360watts provides cutting-edge solar power solutions and smart home automation in Coimbatore, Tamil Nadu. Save energy, reduce bills, and live sustainably with our integrated platform." />
    <meta name="keywords" content="solar power, smart home, home automation, renewable energy, solar panels, Coimbatore, Tamil Nadu, energy savings, sustainable living" />
    <meta name="author" content="360watts" />
    <meta name="theme-color" content="#00a63e" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://360watts.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="360watts - Smart Solar & Home Automation Solutions" />
    <meta property="og:description" content="Transform your home with solar power and smart automation. Save energy, reduce bills, and live sustainably." />
    <meta property="og:image" content="https://360watts.com/final-logo-png-4x-1.png" />
    <meta property="og:url" content="https://360watts.com/" />
    <meta property="og:site_name" content="360watts" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="360watts - Smart Solar & Home Automation" />
    <meta name="twitter:description" content="Transform your home with solar power and smart automation." />
    <meta name="twitter:image" content="https://360watts.com/final-logo-png-4x-1.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "360watts",
      "url": "https://360watts.com",
      "logo": "https://360watts.com/final-logo-png-4x-1.png",
      "description": "360watts provides cutting-edge solar power solutions and smart home automation in Coimbatore, Tamil Nadu.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Coimbatore",
        "addressRegion": "Tamil Nadu",
        "addressCountry": "IN"
      }
    }
    </script>

    <!-- Third-party preconnect for faster form submit -->
    <link rel="preconnect" href="https://formsubmit.co" />

    <!-- Google Fonts — preconnect then async load to avoid render-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&family=Urbanist:wght@400;700&family=Figtree:wght@400;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&family=Urbanist:wght@400;700&family=Figtree:wght@400;700&display=swap" />
    </noscript>

    <style>
      /* Smooth scrolling */
      html {
        scroll-behavior: smooth;
      }

      /* Loading state */
      #app:empty::before {
        content: "Loading...";
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: 'Urbanist', sans-serif;
        font-size: 24px;
        color: #00a63e;
      }
    </style>
    <link href="tailwind.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/final-logo-png-4x-1.png" />
    <!-- Preload LCP hero image — responsive WebP variants so the browser
         fetches only the size it needs (mobile 640 w, tablet 1280 w, desktop full). -->
    <link rel="preload" as="image" href="/smartEnergy.webp"
          imagesrcset="/smartEnergy-640.webp 640w, /smartEnergy-1280.webp 1280w, /smartEnergy.webp 1920w"
          imagesizes="100vw" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/index.tsx"></script>
